name: Fetch TemperaturaZraka

on:
  schedule:
    - cron: '0 15 * * *'   # vsak dan ob 17:00 CET (15:00 UTC)
  workflow_dispatch:         # možnost ročnega zagona

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch in parse temperaturo zraka
        run: |
          python3 << 'EOF'
          import requests
          from bs4 import BeautifulSoup
          import json
          import os
          from datetime import datetime, timezone, timedelta

          URL = 'https://meteo.hr/podaci.php?section=podaci_vrijeme&param=hrvatska1_n'
          OUT = 'actions/temperatura-zraka.json'
          CET = timezone(timedelta(hours=2))  # CEST poleti
          danes = datetime.now(CET).strftime('%Y-%m-%d')
          ura = datetime.now(CET).strftime('%H:%M')

          r = requests.get(URL, timeout=30)
          r.encoding = 'utf-8'
          soup = BeautifulSoup(r.text, 'html.parser')

          # najdi tabelo s postajami - iščemo tabelo ki ima header z "temperatura"
          tables = soup.find_all('table')
          table = None
          temp_col = None
          for t in tables:
              rows = t.find_all('tr')
              if not rows:
                  continue
              header_cells = rows[0].find_all(['th', 'td'])
              stolpci = [h.get_text(strip=True).lower() for h in header_cells]
              # poišči stolpec z temperaturo
              for i, s in enumerate(stolpci):
                  if 'temp' in s or s == 't':
                      table = t
                      temp_col = i  # indeks vključno s prvim stolpcem (ime postaje)
                      break
              if table is not None:
                  break

          if table is None:
              print("NAPAKA: tabela s temperaturo ni najdena!")
              exit(1)

          rows = table.find_all('tr')
          print(f"Tabela najdena, stolpec temperature: {temp_col}, vrstic: {len(rows)}")

          # besede ki nakazujejo da gre za legendo, ne postajo
          LEGENDA_KLJUCNE = ['boja', 'znač', 'znac', 'legenda', 'color', 'colour']

          postaje = {}
          for row in rows[1:]:
              cells = row.find_all(['td', 'th'])
              if len(cells) < temp_col + 1:
                  continue
              ime = cells[0].get_text(strip=True)
              if not ime:
                  continue
              # preskoči vrstice legende
              ime_lower = ime.lower()
              if any(k in ime_lower for k in LEGENDA_KLJUCNE):
                  continue
              # preskoči header vrstice (samo besede brez številk)
              val_raw = cells[temp_col].get_text(strip=True)
              if not val_raw or val_raw == '-':
                  continue
              try:
                  temperatura = float(val_raw.replace(',', '.'))
              except ValueError:
                  continue  # ni številka → preskoči
              postaje[ime] = temperatura

          nov_zapis = {
              'datum': danes,
              'ura': ura,
              'postaje': postaje
          }

          # naloži obstoječe in dodaj
          if os.path.exists(OUT):
              with open(OUT, 'r', encoding='utf-8') as f:
                  podatki = json.load(f)
          else:
              podatki = []

          # posodobi če datum že obstaja, sicer dodaj
          for i, z in enumerate(podatki):
              if z.get('datum') == danes:
                  podatki[i] = nov_zapis
                  break
          else:
              podatki.append(nov_zapis)

          with open(OUT, 'w', encoding='utf-8') as f:
              json.dump(podatki, f, ensure_ascii=False, indent=2)

          print(f"OK: {danes} {ura}, {len(postaje)} postaj, shranjeno v {OUT}")
          print(f"Skupaj zapisov: {len(podatki)}")
          EOF

      - name: Commit & push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add actions/temperatura-zraka.json
          git diff --cached --quiet || git commit -m "Temperatura zraka $(date -u '+%Y-%m-%d')"
          git push
