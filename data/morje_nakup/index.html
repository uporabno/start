  <div class="container-fluid">
    <br/>


    <script>
        console.log(data);
    
        var tmpSklop = "";
        var tmpPodsklop = "";
        var sklopZamenjan = false;
        var podsklopZamenjan = false;
        for(var i=0; i< data.povezave.length; i++){
            //
            // sklop
            //
            if (data.povezave[i].sklop != tmpSklop) {
                // novi card
                sklopZamenjan = true;
                if (i!=0) {
                    // zaključi prejšnji card in še prej podsklop
                    document.write('            </p>');
                    document.write('          </div>');
                    document.write('        </div>');
                    document.write('     </div>');
                    document.write('   </div>');
                }
                // glava novega carda
                document.write('    <div class="card" style="width: 35rem;">'); // prej 32rem;
                document.write('      <h3 class="card-header card-' + data.povezave[i].barva_sklopa + '">' + data.povezave[i].sklop + '</h3>');
                document.write('      <div class="card-block">');
                document.write('        <div class="row">');
                document.write('          <div class="col-sm-12">');

                tmpSklop = data.povezave[i].sklop;
            }
            //
            // podsklop
            //
            if (data.povezave[i].podsklop != tmpPodsklop) {
                podsklopZamenjan = true;
                if (sklopZamenjan == false) {
                    // zaključi text prejšnjega podsklopa
                    document.write('            </p>');
                }
                // text novega podsklopa
                tmpPodsklop = data.povezave[i].podsklop;                    
                document.write('              <p><b>' + data.povezave[i].podsklop + ': </b>');
            }          
            //
            // povezava
            //
            // document.write('              <button onclick="parent.open(' + "'" + data.povezave[i].link + "'" + ')" type="button" class="btn btn-' + data.povezave[i].barva_gumba + ' btn-sm">' + data.povezave[i].ime_povezave + '</button>');
            document.write('              <a target="_blank" href="' + data.povezave[i].link + '">');
            document.write('              <button type="button" class="btn btn-' + data.povezave[i].barva_gumba + ' btn-sm">' + data.povezave[i].ime_povezave + '</button>');
            document.write('              </a>');
            if (data.povezave[i].opis) {
                document.write('              <font color="gray">');
                document.write('              <span>' + data.povezave[i].opis + '</span>');
                document.write('              </font>');
            }
            //
            sklopZamenjan = false;
            podsklopZamenjan = false;
        }
        // zaključi prejšnji card in še prej podsklop
        document.write('            </p>');
        document.write('          </div>');
        document.write('        </div>');
        document.write('     </div>');
        document.write('   </div>');
    </script>
