  <p id="rezultati"><p>

<script>

  var crke = document.getElementById("crke").value.toUpperCase();
  var dolzina = Number(document.getElementById('dolzine').value);
  var rezultatov = 0;
  document.getElementById("rezultati").innerHTML = "";

  //console.log('Dolžina='+dolzina);

    if (besede[i].length == dolzina) {
      b = besede[i].toUpperCase();
      for (j=0; j<crke.length; j++) {
        b = b.replace(crke[j], "");
      }
      if (b == "") {
        ++rezultatov;
        if (rezultatov != 1) 
          document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + "<br/>";
        document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + '<code>' + besede[i] + '</code>';
      }
    }
  }

function reverseString(str) {
  return str.split("").reverse().join("");
}

function mySearchPalindromi() {
  document.getElementById("rezultati").innerHTML = "";
  document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + "<b>Palindromi:</b><br/>";
  console.log('Start');
  var b = "";
  for (i=0; i<besede.length/*-350907*/; i++) {
    b = besede[i].toUpperCase();
    if (b == (reverseString(b))) {
      document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + '<code>' + b.toLowerCase() + "</code><br/>";            
    }
  }
  document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + "" + "<font color='silver'><small>-- <i>končano</i> --</small></font>";
  console.log('Konec');
}

function myAnalize() {
  console.log('Start analiza');
  document.getElementById("rezultati").innerHTML = "";
  var crke = document.getElementById("crke").value.toUpperCase();
  //var dolzina = Number(document.getElementById('dolzine').value);
  for (dolzina=crke.length; dolzina>2; dolzina--) {
    if ( (dolzina != crke.length) && (rezultatov != 0))
       document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + "<br/><br/>";  
    if ( (dolzina != crke.length) && (rezultatov == 0))
      document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + "<br/>";  
    document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + "<b>Dolžina " + dolzina + ":</b><br/>";
    var rezultatov = 0;
    var b = "";
    for (i=0; i<besede.length; i++) {
      if (besede[i].length == dolzina) {
        b = besede[i].toUpperCase();
        for (j=0; j<crke.length; j++) {
          b = b.replace(crke[j], "");
        }
        if (b == "") {
          ++rezultatov;
          if (rezultatov != 1) 
            document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + "<br/>";
          document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + '&nbsp;&nbsp;<code>' + besede[i] + '</code>';
        }
      }
    }
  }
  document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + "<br/>" + "<font color='silver'><small>-- <i>končano</i> --</small></font>";
  console.log('Konec');
}
