<!DOCTYPE html>
<html>
<head>
	<title>Besede - palindromi</title>
	<meta http-equiv="content-type" content="text/html;charset=UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
	<script src="besede-utf8.js"></script>
</head>

<body>
	<form>
	  <div>Palindormi</div>
	  <br/>
	  <button type="button" onclick="mySearch()">Išči</button>
	</form>
	<p id="rezultati"><p>

<script>

function reverseString(str) {
    return str.split("").reverse().join("");
}

function mySearch() {
	document.getElementById("rezultati").innerHTML = "";
	console.log('Start');
    var b = "";
	for (i=0; i<besede.length/*-350907*/; i++) {
        b = besede[i].toUpperCase();
        if (b == (reverseString(b))) {
		    document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + b +"<br/>";		    
		}
	}
	document.getElementById("rezultati").innerHTML = document.getElementById("rezultati").innerHTML + "<br/>" + "-- končano --";
	console.log('Konec');
}

</script>

</body>
</html>
