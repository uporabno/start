    <script type = "text/javascript">
    max_w = 250+100
    min_w = 40
    delta = 3;
    speed = 15;
    function startTimer() {
        var img = document.getElementById("slikaspodaj");
        if(img && img.style)
            img.style.width = max_w + "px";
        setInterval(changeImage, speed);
    }
    function changeImage() {
        var img = document.getElementById("slikaspodaj");
        if(img && img.style) {
            //img.style.width = Math.random()*200 + "px";
            w = img.style.width;
            w = w.slice(0, -2);
            w = w - delta;
            if (w <= min_w) {
                delta = -delta;
            }
            if (w > max_w) {
                w = max_w;
                delta = -delta;
            }
            img.style.width = w + "px";
            //console.log("Width=" + img.style.width);
        }
    }
    </script>
</head>
